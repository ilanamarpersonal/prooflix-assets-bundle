# E2E: end-to-end run of the data flow. For now it triggers the bronze pipeline;
# add later layers (silver, gold) as further tasks that depend on run_bronze.
# The file name (without .yaml) is the pipeline id: "e2e".
name: E2E
description: End-to-end run, triggers the bronze pipeline

tasks:
  # Call bronze as a sub-pipeline (it uses its own default parameters).
  - key: run_bronze
    type: pipeline
    description: Run the bronze pipeline
    pipeline: bronze

outputs:
  bronze_checkpoint: ${tasks.run_bronze.output.checkpoint}
  bronze_files: ${tasks.run_bronze.output.files}
  bronze_rows: ${tasks.run_bronze.output.rows}
