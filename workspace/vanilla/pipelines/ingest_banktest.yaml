# Managed by the Ingestion tab: copies tables of a relational database into bronze.
# Configure it there: saving the job rewrites this file.
name: accounts_test
description: Copies 1 table of the banktest database into bronze (Ingestion tab).
parameters: {from_date: null, to_date: null}
tasks:
- key: ingest
  type: python
  entrypoint: prooflix.tasks.jdbc_ingest:run
  parameters:
    connection: banktest
    start_date: '1971-01-10'
    tables:
    - source: bank.accounts
      target: banktest_accounts
      columns: []
      watermark: updated_at
      keys: [account_id]
    from_date: ${params.from_date}
    to_date: ${params.to_date}
