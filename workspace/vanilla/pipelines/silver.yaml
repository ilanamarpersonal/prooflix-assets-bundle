# Silver: the bronze tables with their dates as date-times, plus dimension tables.
# The file name (without .yaml) is the pipeline id: "silver".
name: Silver
description: Streams new bronze rows into <tenant_id>.silver with long dates as date-times, and loads the CSV dimension seeds

# Layout:
#   <tenant_id>.bronze.<table>                    read (new rows only)
#   <tenant_id>.silver.<table>                    written: date columns as timestamps (UTC)
#   <tenant_id>.silver.dim_<seed>                 written from seeds/<seed>.csv
#   data/<tenant_id>/checkpoint/silver/<table>/   Spark's streaming checkpoint
parameters:
  tenant_id:                                      # typed: checked by Prooflix before the run starts
    type: identifier                              # a short lowercase identifier, like tenant1
    default: tenant1
    required: true
    description: Tenant whose catalog the run writes (<tenant_id>.silver.<table>)
  tables: [customers, accounts, transactions]
  datetime_columns: [date_of_birth, joined_date, opened_date, transaction_ts]  # long ms -> timestamp (UTC)
  seeds_dir: seeds

tasks:
  # Python code from src/silver/conform.py, run on Spark
  - key: conform
    type: python
    description: Convert long dates to date-times, bronze -> silver; load the seeds
    entrypoint: silver.conform:run
    parameters:
      tables: ${params.tables}
      datetime_columns: ${params.datetime_columns}
      tenant_id: ${params.tenant_id}
      checkpoint_dir: data/${params.tenant_id}/checkpoint/silver
      seeds_dir: ${params.seeds_dir}

outputs:
  tenant_id: ${params.tenant_id}
  tables: ${tasks.conform.output.tables}
  rows: ${tasks.conform.output.rows}
  dimensions: ${tasks.conform.output.dimensions}
